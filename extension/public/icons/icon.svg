<svg width="128" height="128" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="128" height="128" rx="24" fill="url(#bgGrad)" />
  
  <!-- Brain icon (simplified) -->
  <g fill="white" opacity="0.95">
    <!-- Top left lobe -->
    <circle cx="50" cy="48" r="16" />
    <!-- Top right lobe -->
    <circle cx="78" cy="48" r="16" />
    <!-- Bottom left lobe -->
    <circle cx="50" cy="76" r="16" />
    <!-- Bottom right lobe -->
    <circle cx="78" cy="76" r="16" />
    <!-- Center connection -->
    <rect x="58" y="40" width="12" height="48" rx="6" />
  </g>
  
  <!-- Accent dot -->
  <circle cx="64" cy="90" r="4" fill="white" opacity="0.8" />
</svg>
